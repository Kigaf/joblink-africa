<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="index,follow"><title>Article | JobLink Africa</title><link rel="stylesheet" href="assets/style.css"><style>.article-wrap{max-width:850px;margin:auto;padding:45px 22px 70px}.article-wrap article{line-height:1.85;color:#30495d}.article-wrap h1{font-size:clamp(2rem,5vw,3rem);color:#102b46;line-height:1.15}.article-meta{color:#708193;font-size:13px}.article-cover{width:100%;max-height:420px;object-fit:cover;border-radius:16px;margin:22px 0}.article-content{white-space:pre-wrap;line-height:1.9;font-size:17px}.article-content p{margin:0 0 1.2em}</style></head><body><header class="topbar"><a class="brand" href="index.html"><span class="logo">JL</span><span>JobLink <b>Africa</b><small>Your next opportunity starts here</small></span></a><nav><a href="blog.html">Blog</a><a href="index.html">Find jobs</a></nav></header><main class="article-wrap"><a href="blog.html">← Back to Blog</a><article id="article"><p>Loading article…</p></article></main><script src="assets/config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const root=document.getElementById('article'),slug=new URLSearchParams(location.search).get('slug');if(!slug||!JOBLINK_CONFIG?.SUPABASE_URL){root.textContent='Article not found.'}else{const db=supabase.createClient(JOBLINK_CONFIG.SUPABASE_URL,JOBLINK_CONFIG.SUPABASE_ANON_KEY);db.from('blog_articles').select('title,category,excerpt,content,author,cover_image,published_at').eq('slug',slug).eq('status','published').maybeSingle().then(({data,error})=>{if(error||!data){root.textContent='This article is unavailable.';return}document.title=data.title+' | JobLink Africa';root.replaceChildren();const cat=document.createElement('p');cat.textContent=data.category;cat.className='article-meta';const h=document.createElement('h1');h.textContent=data.title;const meta=document.createElement('p');meta.className='article-meta';meta.textContent=(data.author||'JobLink Africa')+' · '+new Date(data.published_at||Date.now()).toLocaleDateString();root.append(cat,h,meta);if(data.cover_image){const img=document.createElement('img');img.className='article-cover';img.src=data.cover_image;img.alt='';root.append(img)}const ex=document.createElement('p');ex.textContent=data.excerpt;root.append(ex);const body=document.createElement('div');body.className='article-content';data.content.split(/\n\s*\n/).forEach(t=>{const p=document.createElement('p');p.textContent=t;body.append(p)});root.append(body)})}</script></body></html>
